name: Publish Dev Package

on:
  push:
    branches: [ lfalslev/bed-7214 ]
    #branches: [ v4 ]

jobs:
  update-dev-package:
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - name: Restore Dependencies
        run: dotnet restore

      - name: Pack
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          mkdir pkgs
          dotnet pack --no-restore -c Release \
            -p:PackageVersion=0.0.0-dev.$SHORT_SHA \
            -o ./pkgs
          ls -la ./pkgs

      - name: Publish to SpecterOps Packages
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_KEY }}
        run: |
          dotnet tool install -g sleet
#          sleet push ./pkgs --force
          sleet retention prune --stable 0 --prerelease 2 --release-labels 1 --dry-run