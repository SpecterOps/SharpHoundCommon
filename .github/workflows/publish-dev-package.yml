name: Publish Dev Package

on:
  push:
    branches:
      - "lfalslev/bed-7214"
#      - "v4"

jobs:
  update-dev-package:
    name: update-dev-package
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - name: Compute dev version
        id: version
        shell: pwsh
        run: |
          $base_version = dotnet msbuild .\src\CommonLib\SharpHoundCommonLib.csproj --getProperty:Version
          $date_stamp = Get-Date -Format 'yyyyMMddHHmm'
          "dev_version=$base_version-dev.$date_stamp" >> $env:GITHUB_OUTPUT

      - name: Restore dependencies
        run: dotnet restore

      - name: Pack
        run: |
          mkdir pkgs
          dotnet pack --no-restore -c Release -p:PackageVersion=${{ steps.version.outputs.dev_version }} -o ./pkgs

      #the prune command deletes older package versions to avoid -dev package clutter
      #it groups packages by -label, and keeps the 5 latest of each pre-release label (-rc1, -rc2, -dev, etc)
      - name: Publish to SpecterOps Packages
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_KEY }}
        run: |
          dotnet tool install -g sleet
          sleet push ./pkgs
          sleet retention prune --package SharpHoundCommon --package SharpHoundRPC `
            --stable 999 --prerelease 5 --release-labels 1