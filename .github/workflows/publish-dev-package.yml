name: Publish Dev Package

on:
  push:
    branches:
      - "lfalslev/bed-7214"
      #- "v4"

jobs:
  update-dev-package:
    name: update-dev-package
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - name: Restore Dependencies
        run: dotnet restore

      - name: Pack
        run: |
          $DATE_STAMP=$(date +%Y%m%d%H%M)
          mkdir pkgs
          dotnet pack --no-restore -c Release -p:PackageVersion=0.0.0-dev.$DATE_STAMP -o ./pkgs

      - name: Publish to SpecterOps Packages
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_KEY }}
        run: |
          dotnet tool install -g sleet
          sleet push ./pkgs
        #group by v.v.v-label, keep 3 latest of each label, to avoid -dev package clutter
          sleet retention prune --package SharpHoundCommon --package SharpHoundRPC `
               --stable 999 --prerelease 3 --release-labels 1 --dry-run